
name: SuperStar

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  Start:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure SuperStar
        env:
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          CHAOXING_COURSE_LIST: ${{ secrets.CHAOXING_COURSE_LIST }}
          TIKU_TOKENS: ${{ secrets.TIKU_TOKENS }}
        run: |
          python - <<'PY'
          import configparser
          import os
          import sys

          required = [
              "CHAOXING_USERNAME",
              "CHAOXING_PASSWORD",
              "CHAOXING_COURSE_LIST",
              "TIKU_TOKENS",
          ]

          missing = [
              name for name in required
              if not os.environ.get(name, "").strip()
          ]

          if missing:
              print("Missing GitHub Secrets: " + ", ".join(missing))
              sys.exit(1)

          config = configparser.ConfigParser()
          loaded = config.read(
              "config_template.ini",
              encoding="utf-8"
          )

          if not loaded:
              raise FileNotFoundError(
                  "config_template.ini not found"
              )

          if not config.has_section("common"):
              raise ValueError("Missing [common] section")

          if not config.has_section("tiku"):
              raise ValueError("Missing [tiku] section")

          common = config["common"]
          common["username"] = os.environ[
              "CHAOXING_USERNAME"
          ].strip()
          common["password"] = os.environ[
              "CHAOXING_PASSWORD"
          ].strip()
          common["course_list"] = os.environ[
              "CHAOXING_COURSE_LIST"
          ].strip()
          common["use_cookies"] = "false"

          tiku = config["tiku"]
          tiku["provider"] = "TikuYanxi"
          tiku["tokens"] = os.environ[
              "TIKU_TOKENS"
          ].strip()
          tiku["check_llm_connection"] = "false"
          tiku["submit"] = "true"

          with open("config.ini", "w", encoding="utf-8") as f:
              config.write(f)

          print("Configuration generated successfully.")
          print("Provider: TikuYanxi")
          print(
              "Course count:",
              len([
                  x for x in common["course_list"].split(",")
                  if x.strip()
              ])
          )
          print("Automatic submission: enabled")
          PY

      - name: Run SuperStar
        run: python main.py -c config.ini
