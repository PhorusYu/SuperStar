
name: 刷课喵

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  Start:
    runs-on: ubuntu-latest

    steps:
      - name: 拷贝代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖包
        run: python -m pip install -r requirements.txt

      - name: 配置 SuperStar
        env:
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          CHAOXING_COURSE_LIST: ${{ secrets.CHAOXING_COURSE_LIST }}
          TIKU_TOKENS: ${{ secrets.TIKU_TOKENS }}
        run: |
          python - <<'PY'
          import configparser
          import os
          import sys

          required = [
              "CHAOXING_USERNAME",
              "CHAOXING_PASSWORD",
              "CHAOXING_COURSE_LIST",
              "TIKU_TOKENS",
          ]

          missing = [
              name for name in required
              if not os.environ.get(name, "").strip()
          ]

          if missing:
              print("缺少以下 GitHub Secrets：" + ", ".join(missing))
              sys.exit(1)

          config = configparser.ConfigParser()

          loaded = config.read(
              "config_template.ini",
              encoding="utf-8"
          )

          if not loaded:
              raise FileNotFoundError("找不到 config_template.ini")

          if not config.has_section("common"):
              raise ValueError("模板缺少 [common] 配置")

          if not config.has_section("tiku"):
              raise ValueError("模板缺少 [tiku] 配置")

          common = config["common"]
          common["username"] = os.environ["CHAOXING_USERNAME"].strip()
          common["password"] = os.environ["CHAOXING_PASSWORD"].strip()
          common["course_list"] = os.environ["CHAOXING_COURSE_LIST"].strip()
          common["use_cookies"] = "false"

          tiku = config["tiku"]
          tiku["provider"] = "TikuYanxi"
          tiku["tokens"] = os.environ["TIKU_TOKENS"].strip()
          tiku["check_llm_connection"] = "false"

          with open("config.ini", "w", encoding="utf-8") as f:
              config.write(f)

          print("配置文件生成成功")
          print("题库提供方：TikuYanxi")
          print("课程数量：", len([
              x for x in common["course_list"].split(",")
              if x.strip()
          ]))
          PY

      - name: 运行 SuperStar
        run: python main.py -c config.ini
