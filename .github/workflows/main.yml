name: 刷课

on:
  push:
    branches: [ main ]
  # 是否开启每天 8 点定时运行，开启时取消下面两行注释
  # schedule:
  #   - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  Start:
    runs-on: ubuntu-latest
    steps:
      - name: 拷贝代码
        uses: actions/checkout@v4

      - name: 恢复历史答题缓存
        shell: bash
        run: |
          # GitHub Actions 每次运行都是临时环境；从专用 answer-cache 分支恢复 cache.json。
          if git fetch origin answer-cache 2>/dev/null; then
            if git show origin/answer-cache:cache.json > cache.json 2>/dev/null; then
              echo "已恢复历史题目缓存"
            else
              echo '{}' > cache.json
              echo "缓存分支中没有 cache.json，创建空缓存"
            fi
          else
            echo '{}' > cache.json
            echo "尚无历史缓存，首次运行将创建缓存"
          fi

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖包
        run: pip install -r ./requirements.txt

      - name: Run main.py
        id: run_main
        continue-on-error: true
        env:
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          CHAOXING_COURSE_LIST: ${{ secrets.CHAOXING_COURSE_LIST }}
        run: python main.py -u "$CHAOXING_USERNAME" -p "$CHAOXING_PASSWORD" -l "$CHAOXING_COURSE_LIST"

      - name: 保存更新后的题目缓存
        if: always()
        shell: bash
        run: |
          set -e
          if [ ! -s cache.json ]; then
            echo "cache.json 不存在或为空，跳过缓存保存"
            exit 0
          fi

          # 先备份缓存，再切换到专用分支；answer-cache 分支只保存 cache.json。
          cp cache.json /tmp/superstar-cache.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch origin answer-cache 2>/dev/null; then
            git checkout -B answer-cache origin/answer-cache
          else
            git checkout --orphan answer-cache
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp /tmp/superstar-cache.json cache.json
          git add -f cache.json
          if git diff --cached --quiet; then
            echo "题目缓存没有变化，无需提交"
          else
            git commit -m "chore: update answer cache [skip ci]"
            git push origin HEAD:answer-cache
            echo "已将题目缓存保存到 answer-cache 分支"
          fi

      - name: 检查主程序运行结果
        if: always() && steps.run_main.outcome == 'failure'
        run: |
          echo "main.py 运行失败；已尝试保存本次产生的缓存。请查看上面的运行日志。"
          exit 1
